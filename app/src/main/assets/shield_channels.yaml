
dns:
    enable: true
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    fake-ip-filter:
    - '*.lan'
    - '*.local'
    - +.stun.*
    default-nameserver:
    - 77.88.8.8
    - 8.8.8.8
    nameserver:
    - 77.88.8.8
    - 77.88.8.1
    - tls://8.8.8.8:853
sniffer:
    enable: true
    sniff:
      HTTP:
        ports:
        - 80
      TLS:
        ports:
        - 443
        - 8443
proxies:

  - name: "🇫🇮 Enterprise WiFi/LTE"
    type: vless
    server: enterprisechat.ru
    port: 443
    uuid: e5714788-bab6-4502-9220-375d29428583
    udp: true
    tls: true
    servername: enterprisechat.ru
    client-fingerprint: chrome
    alpn:
    - http/1.1
    network: ws
    ws-opts:
      path: /static/js/9f3a.bundle
      headers:
        Host: enterprisechat.ru
  - name: "🇷🇺 Прямой"
    type: vless
    server: enterprisechat.ru
    port: 443
    uuid: e5714788-bab6-4502-9220-375d29428583
    udp: true
    tls: true
    servername: enterprisechat.ru
    client-fingerprint: chrome
    alpn:
    - http/1.1
    network: ws
    ws-opts:
      path: /assets/img/7b2c.js
      headers:
        Host: enterprisechat.ru
  - name: "🇫🇮 Enterprise Direct"
    type: vless
    server: 138.124.99.46
    port: 15448
    uuid: e5714788-bab6-4502-9220-375d29428583
    udp: true
    tls: true
    servername: chat.138-124-99-46.sslip.io
    client-fingerprint: chrome
    alpn:
    - http/1.1
    network: ws
    ws-opts:
      path: /direct
      headers:
        Host: chat.138-124-99-46.sslip.io
  - name: "🇫🇮 Enterprise XHTTP"
    type: vless
    server: api.enterprise-shield.ru
    port: 443
    uuid: e5714788-bab6-4502-9220-375d29428583
    udp: true
    tls: true
    servername: api.enterprise-shield.ru
    client-fingerprint: chrome
    alpn:
    - h2
    - http/1.1
    network: xhttp
    xhttp-opts:
      path: /xhttp
      mode: auto
proxy-groups:
  - name: "🚀 Каналы"
    type: select
    proxies:
    - "♻️ Авто-выбор"
    - "🇷🇺 Прямой"
    - "🇫🇮 Enterprise WiFi/LTE"
    - "🇫🇮 Enterprise Direct"
    - "🇫🇮 Enterprise XHTTP"
  - name: "♻️ Авто-выбор"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    lazy: true
    tolerance: 150
    proxies:
    - "🇷🇺 Прямой"
    - "🇫🇮 Enterprise WiFi/LTE"
  - name: "🧱 Заблокированное"
    type: select
    proxies:
    - "🇷🇺 Прямой"
    - DIRECT
rules:
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT
  - GEOSITE,category-ads-all,REJECT
  - DOMAIN-SUFFIX,pikabu.ru,🚀 Каналы
  - DOMAIN-SUFFIX,habr.com,🚀 Каналы
  - DOMAIN-SUFFIX,4pda.to,🚀 Каналы
  - DOMAIN-SUFFIX,4pda.ru,🚀 Каналы
  - DOMAIN-SUFFIX,kemono.su,🚀 Каналы
  - DOMAIN-SUFFIX,jut.su,🚀 Каналы
  - DOMAIN-SUFFIX,kara.su,🚀 Каналы
  - DOMAIN-SUFFIX,theins.ru,🚀 Каналы
  - DOMAIN-SUFFIX,tvrain.ru,🚀 Каналы
  - DOMAIN-SUFFIX,echo.msk.ru,🚀 Каналы
  - DOMAIN-SUFFIX,the-village.ru,🚀 Каналы
  - DOMAIN-SUFFIX,snob.ru,🚀 Каналы
  - DOMAIN-SUFFIX,novayagazeta.ru,🚀 Каналы
  - DOMAIN-SUFFIX,moscowtimes.ru,🚀 Каналы
  - DOMAIN-REGEX,\.(ru|su|moscow|tatar|xn--80adxhks|xn--80asehdb|xn--80aswg|xn--c1avg|xn--d1acj3b|xn--p1acf|xn--p1ai)$,DIRECT
  - GEOSITE,category-ru,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,ru,DIRECT
  - MATCH,🚀 Каналы
