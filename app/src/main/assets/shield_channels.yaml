# Enterprise Shield — два канала
proxies:
  - name: "🇩🇪 Экстрим"
    type: vless
    server: 89.208.103.229
    port: 8443
    uuid: e5714788-bab6-4502-9220-375d29428583
    udp: true
    tls: true
    servername: max.ru
    network: xhttp
    client-fingerprint: chrome
    reality-opts:
      public-key: B9UL-YKQHYtf6A-gytkGQ8b2GJL6MFmlrHropnVAcjo
      short-id: 7f3a91c0d4b28e65
    xhttp-opts:
      path: /ent
      mode: auto
  - name: "🇩🇪 Enterprise LTE"
    type: vless
    server: api.enterprise-shield.ru
    port: 443
    uuid: e5714788-bab6-4502-9220-375d29428583
    udp: true
    tls: true
    servername: api.enterprise-shield.ru
    client-fingerprint: chrome
    alpn:
    - http/1.1
    network: ws
    ws-opts:
      path: /ent-lte
      headers:
        Host: api.enterprise-shield.ru
proxy-groups:
  - name: "🚀 Каналы"
    type: select
    proxies:
    - "♻️ Авто-выбор"
    - "🇩🇪 Экстрим"
    - "🇩🇪 Enterprise LTE"
  - name: "♻️ Авто-выбор"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    lazy: true
    tolerance: 150
    proxies:
    - "🇩🇪 Экстрим"
    - "🇩🇪 Enterprise LTE"
  - name: "📹 YouTube"
    type: url-test
    url: https://www.youtube.com/generate_204
    interval: 300
    proxies:
    - "🇩🇪 Экстрим"
    - "🇩🇪 Enterprise LTE"
  - name: "✈️ Telegram"
    type: url-test
    url: https://web.telegram.org
    interval: 300
    proxies:
    - "🇩🇪 Экстрим"
    - "🇩🇪 Enterprise LTE"
  - name: "🧱 Заблокированное"
    type: select
    proxies:
    - "♻️ Авто-выбор"
    - DIRECT
rules:
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,category-ru,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,ru,DIRECT
  - GEOSITE,telegram,✈️ Telegram
  - GEOSITE,youtube,📹 YouTube
  - MATCH,🚀 Каналы
