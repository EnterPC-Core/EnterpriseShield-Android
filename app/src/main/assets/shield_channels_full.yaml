proxy-groups:
  - name: 🚀 Каналы
    type: select
    proxies:
    - ♻️ Авто-выбор
    - Enterprise Польша
    - Enterprise Германия
    - Enterprise Чехия
    - Enterprise Франция
    - Enterprise Нидерланды
    - Enterprise Беларусь
    - Enterprise Финляндия
    - Enterprise Индия
    - Enterprise Казахстан
    - Enterprise Турция
    - Enterprise США
    - Enterprise Великобритания
    - Enterprise Сингапур
    - Enterprise LTE (Германия)
    - Enterprise LTE 2 (Сургут)
    - Enterprise LTE 3 (Москва)
    - Enterprise Extra 1
  - name: "♻️ Авто-выбор"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    lazy: true
    tolerance: 150
    proxies: &id001
    - Enterprise Польша
    - Enterprise Германия
    - Enterprise Чехия
    - Enterprise Франция
    - Enterprise Нидерланды
    - Enterprise Беларусь
    - Enterprise Финляндия
    - Enterprise Индия
    - Enterprise Казахстан
    - Enterprise Турция
    - Enterprise США
    - Enterprise Великобритания
    - Enterprise Сингапур
    - Enterprise LTE (Германия)
    - Enterprise LTE 2 (Сургут)
    - Enterprise LTE 3 (Москва)
    - Enterprise Extra 1
  - name: 📹 YouTube
    type: url-test
    url: https://www.youtube.com/generate_204
    interval: 300
    proxies: *id001
  - name: ✈️ Telegram
    type: url-test
    url: https://web.telegram.org
    interval: 300
    proxies: *id001
  - name: 🧱 Заблокированное
    type: select
    proxies:
    - ♻️ Авто-выбор
    - DIRECT
  - name: 🤖 AI
    type: url-test
    url: https://chatgpt.com
    interval: 300
    proxies: *id001
