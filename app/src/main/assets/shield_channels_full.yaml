proxy-groups:
  - name: 🚀 Каналы
    type: select
    proxies:
    - ♻️ Авто-выбор
    - Enterprise Польша
    - Enterprise Германия
    - Enterprise Франция
    - Enterprise Нидерланды
    - Enterprise Беларусь
    - Enterprise Сингапур
    - Enterprise LTE (Германия)
    - Enterprise LTE 2 (Сургут)
  - name: "♻️ Авто-выбор"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    lazy: true
    tolerance: 150
    proxies: &id001
    - Enterprise Польша
    - Enterprise Германия
    - Enterprise Франция
    - Enterprise Нидерланды
    - Enterprise Беларусь
    - Enterprise Сингапур
    - Enterprise LTE (Германия)
    - Enterprise LTE 2 (Сургут)
  - name: 📹 YouTube
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies: *id001
  - name: ✈️ Telegram
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies: *id001
  - name: 🧱 Заблокированное
    type: select
    proxies:
    - ♻️ Авто-выбор
    - DIRECT
  - name: 🤖 AI
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies: *id001
rules:
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,category-ru,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,ru,DIRECT
  - MATCH,🚀 Каналы
