dns:
    enable: true
    listen: 0.0.0.0:1053
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    fake-ip-filter:
    - '*.lan'
    - '*.local'
    - time.*.com
    - +.market.xiaomi.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.stun.*
    - localhost.ptlogin2.qq.com
    - +.srv.nintendo.net
    default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - tls://1.0.0.1:853
profile:
    store-selected: true
    store-fake-ip: true
experimental:
    fragment:
      packets: 1-3
      length: 100-200
      interval: 10-20
sniffer:
    enable: true
    sniff:
      HTTP:
        ports:
        - 80
      TLS:
        ports:
        - 443
        - 8443
